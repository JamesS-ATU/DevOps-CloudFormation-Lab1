AWSTemplateFormatVersion: '2010-09-09'
Description: Cloudformation Assignment 2026

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  ResourceName:
    Type: String
    Default: "Cloudformation Assignment 1"
  StudentID:
    Type: String
    Default: "L00205519"
    AllowedPattern: '^L[0-9]{8}$'
    ConstraintDescription: Must start with L followed by exactly 8 digits (e.g. L00205519).

  StudentName:
    Type: String
    Default: "James Smith"

  Environment:
    Type: String
    Default: Development
    AllowedValues:
      - Development
      - QA
      - UAT
      - Production
    ConstraintDescription: Must be Development, QA, UAT or Production.
  
  WebPort:
    Type: Number
    Default: 80
    AllowedValues:
      - 80
      - 443
    Description: Choose HTTP (80) or HTTPS (443)


  AllowedCIDRIp:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block permitted to access the web server
    AllowedPattern: ^((25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})/(3[0-2]|[12]?[0-9])$
    ConstraintDescription: Must be a valid IPv4 CIDR block.

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${ResourceName}-VPC'
        - Key: StudentID
          Value: !Ref StudentID
        - Key: StudentName
          Value: !Ref StudentName
        - Key: Environment
          Value: !Ref Environment

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ResourceName}-IGW'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ResourceName}-PublicSubnet'
        - Key: StudentID
          Value: !Ref StudentID
        - Key: StudentName
          Value: !Ref StudentName
        - Key: Environment
          Value: !Ref Environment

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet


  ContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: Name
          Value: !Ref ResourceName
        - Key: StudentID
          Value: !Ref StudentID
        - Key: StudentName
          Value: !Ref StudentName
        - Key: Environment
          Value: !Ref Environment
        
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Ref ResourceName
        - Key: StudentID
          Value: !Ref StudentID
        - Key: StudentName
          Value: !Ref StudentName
        - Key: Environment
          Value: !Ref Environment
      GroupDescription: Allow HTTP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref WebPort
          ToPort: !Ref WebPort
          CidrIp: !Ref AllowedCIDRIp

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Name
          Value: !Ref ResourceName
        - Key: StudentID
          Value: !Ref StudentID
        - Key: StudentName
          Value: !Ref StudentName
        - Key: Environment
          Value: !Ref Environment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject]
                Resource:
                  - !GetAtt ContentBucket.Arn
                  - !Sub '${ContentBucket.Arn}/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      Tags:
      - Key: Name
        Value: !Ref ResourceName
      - Key: StudentID
        Value: !Ref StudentID
      - Key: StudentName
        Value: !Ref StudentName
      - Key: Environment
        Value: !Ref Environment
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnet
      InstanceType: t3.micro
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: 
        - !Ref WebSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf install -y httpd
          systemctl enable --now httpd
          cat > /var/www/html/index.html <<EOF
          <html>
            <head><title>${ResourceName}</title></head>
            <body>
              <h1>${StudentID} - ${StudentName}</h1>
              <p>This is a Test Page</p>
            </body>
          </html>
          EOF
          aws s3 cp /var/www/html/index.html s3://${ContentBucket}/index.html
          aws s3 cp s3://${ContentBucket}/index.html /var/www/html/index.html

Outputs:
  WebsiteURL:
    Value: !Sub 'http://${WebServer.PublicDnsName}:${WebPort}'
  BucketName:
    Value: !Ref ContentBucket
